<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        background:#f4f7f5;
        font-family:'Inter', sans-serif;
    }

    .clock-wrapper{
        background:#ffffff;
        padding:28px;
        border-radius:24px;
        box-shadow:
            0 4px 20px rgba(0,0,0,0.06);
        border:1px solid rgba(0, 130, 72, 0.08);
        width:fit-content;
    }

    .clock-header{
        text-align:center;
        margin-bottom:18px;
    }

    .clock-header h1{
        color:#008248;
        font-size:18px;
        font-weight:600;
        letter-spacing:0.5px;
    }

    .clock-header p{
        color:#7a7a7a;
        font-size:13px;
        margin-top:4px;
    }

    iframe{
        border:none;
        overflow:hidden;
        border-radius:16px;
    }

    @media(max-width:600px){
        .clock-wrapper{
            width:95%;
            padding:18px;
        }

        iframe{
            width:100%;
        }
    }
</style>
</head>

<body>

<div class="clock-wrapper">

    <div class="clock-header">
        <h1>Horário Atual</h1>
        <p>Marília • São Paulo</p>
